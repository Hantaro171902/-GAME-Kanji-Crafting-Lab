services:
  frontend:
    image: nginx:alpine
    ports:
      - "5173:80"
    volumes:
      - ./mindforge/build/web:/usr/share/nginx/html:ro
      - ./nginx.preview.conf:/etc/nginx/conf.d/default.conf:ro
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.preview.node
    ports:
      - "3000:3000"